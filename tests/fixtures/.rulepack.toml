# A sample repo for the tests and CI: prose rules in rules/, checks in lint/, code
# that follows them in valid/ and code that breaks them in invalid/. The tests
# copy this folder as a repo of its own.
rules_dir = "rules"
sgconfig = "lint/sgconfig.yml"

[scan]
# invalid/ breaks the checks on purpose; CI scans it alone and expects failures.
exclude = ["invalid/**"]
extensions = [".py"]

[domain_check]
paths = ["lint", "rules"]
exclude = ["invalid"]
