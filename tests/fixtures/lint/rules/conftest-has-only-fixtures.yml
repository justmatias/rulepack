id: conftest-has-only-fixtures
language: Python
severity: warning
message: Keep fixtures and pytest hooks here; move plain helpers to a helpers.py beside this conftest.py
note: |
  pytest loads conftest.py for its fixtures and hooks. A plain helper there is
  imported from a file whose job is setup, so readers cannot tell which names
  are fixtures; a helpers.py next to it makes the split visible.
metadata:
  source: rules/pytest-fixtures.mdc
files:
  - "**/conftest.py"
rule:
  kind: function_definition
  not:
    has:
      field: name
      regex: "^pytest_"
  inside:
    kind: module
