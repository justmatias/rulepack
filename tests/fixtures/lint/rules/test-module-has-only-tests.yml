id: test-module-has-only-tests
language: Python
severity: warning
message: Keep only top-level test_ functions here; move fixtures to conftest.py and plain helpers to a helpers.py beside it
note: |
  Plain test functions need no class boilerplate, and setup in conftest.py keeps
  each test reading as "given these objects, assert this".
files:
  - "**/test_*.py"
rule:
  any:
    - kind: class_definition
    - all:
        - kind: function_definition
        - not:
            has:
              field: name
              regex: "^test_"
  inside:
    any:
      - kind: module
      - kind: decorated_definition
        inside:
          kind: module
