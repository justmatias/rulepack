name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Read-only by default: these jobs run code from the PR branch. Only the
# versioning job gets write access.
permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      # Every pre-commit hook on every file. no-commit-to-branch guards local
      # commits; CI checks out main on every push to it.
      - name: Run pre-commit on all files
        env:
          SKIP: no-commit-to-branch
        run: make lint

      # commit-msg hooks don't run with --all-files: check every commit the PR
      # adds, one message at a time, with the same command as the hook.
      - name: Check the PR's commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The mstack-commit-msg rev in .pre-commit-config.yaml.
          MSTACK_VERSION: v6.7.1
        run: |
          message="$RUNNER_TEMP/commit-message"
          failed=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$message"
            if ! uvx --from "git+https://github.com/justmatias/mstack@${MSTACK_VERSION}" mstack commit-msg "$message"; then
              echo "commit $sha has a non-conventional message" >&2
              failed=1
            fi
          done
          exit "$failed"

      - name: Tests
        run: make test

  # The CLI must behave the same on every OS. `make` is a contributor
  # convenience (bash), so this job calls pytest and rulepack directly.
  portability:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Tests
        run: uv run pytest -q

      - name: rulepack --version
        run: uv run rulepack --version

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      # Audit what uv.lock pins. `uvx pip-audit --local` would audit pip-audit's
      # own isolated environment instead of the project's dependencies.
      - name: Run pip-audit on the locked dependencies
        run: |
          requirements="$RUNNER_TEMP/requirements-audit.txt"
          uv export --frozen --all-groups --no-emit-project --format requirements-txt -o "$requirements"
          uvx pip-audit -r "$requirements" --disable-pip --require-hashes

  versioning:
    name: Versioning
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static-checks, portability, security]
    # The release commit already arrived through the PR (release-prepare.yml).
    # This job only tags it and creates the GitHub release; tags are not
    # covered by the branch ruleset, so no push to main is needed.
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Tag the version in pyproject.toml and create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          # 0.0.0 is the placeholder before the first release; it is never tagged.
          if [[ "$version" == "0.0.0" ]]; then
            echo "No release yet; nothing to tag."
            exit 0
          fi
          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already exists; nothing to release."
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag "$tag"
          git push origin "refs/tags/${tag}"
          gh release create "$tag" --verify-tag --generate-notes

      # Callers may pin `@v<major>` to follow fixes. Move that tag
      # to the release just made; skip when no release was made.
      - name: Move the major version tag
        run: |
          tag="$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n 1)"
          if [[ -z "$tag" ]]; then
            echo "No release tag on HEAD; the major tag stays where it is."
            exit 0
          fi
          major="${tag%%.*}"
          git tag --force "$major" "$tag"
          git push --force origin "refs/tags/$major"
